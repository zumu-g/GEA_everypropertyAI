name: Nightly sale-attributes backfill

# Slow background drip: fills bedrooms/bathrooms/cars/land/building on
# property_sales rows whose Domain feed item omitted them, by fetching each
# row's own listing page via Bright Data Web Unlocker (see
# scripts/backfill-sale-attrs-from-domain.mjs). ~2/3 of comps entered the
# estimator with bedrooms NULL and dodged bed-match weighting (12 Basalt Dr
# investigation, 2026-08-18).
#
# 120 rows/run, most-recent sales first. A Web Unlocker fetch of a listing page
# takes ~15-20s (not 4s), so 120 rows ≈ 40 min; the script stops itself at the
# --max-minutes budget rather than being killed by timeout-minutes. Vacant land
# is skipped and pages without bedrooms are marked in raw_data so the drip
# advances instead of refetching the same rows nightly (2026-09-10 fix: 13 rows
# filled in 3 weeks before that). Idempotent: only NULL columns are ever written.
#
# Schedule: 00:53 UTC ≈ 10:53 Melbourne, after daily-domain-scrape. The old
# 14:41 UTC (00:41 Melbourne) slot hit Domain's protection wall on every row,
# every night from 24 Aug to 9 Sep 2026 — the same URLs fetch fine by day.
# Minute deliberately OFF the top of the hour (GitHub drops :00-queued runs —
# see daily-domain-scrape.yml note).
#
# Required repo secrets (all already present for the Domain feeds):
#   BRIGHTDATA_WEB_UNLOCKER_TOKEN, BRIGHTDATA_WEB_UNLOCKER_ZONE,
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: '53 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-sale-attrs-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRIGHTDATA_WEB_UNLOCKER_TOKEN: ${{ secrets.BRIGHTDATA_WEB_UNLOCKER_TOKEN }}
      BRIGHTDATA_WEB_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_WEB_UNLOCKER_ZONE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Node built-ins only — no npm install needed.
      - name: Backfill 120 rows (most recent first)
        run: node scripts/backfill-sale-attrs-from-domain.mjs --limit 120 --delay 2000 --max-minutes 40
