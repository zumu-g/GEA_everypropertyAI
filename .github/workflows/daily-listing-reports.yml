name: Daily listing reports (55-day + withdrawn)
# Emails Stuart two A4 reports each day: listings that reached 55 days on market
# since the last report, and listings withdrawn since the last report.
# Runs after the morning feeds (~08:20–08:55 AEDT) and the lifecycle reconcile
# (01:17 UTC), which does the sold matching the withdrawn report relies on.
# 01:47 UTC = 12:47 AEDT / 11:47 AEST. Plan: docs/plans/2026-11-23-1311-feat-daily-55day-withdrawn-reports-plan.html
#
# Required repo secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   RESEND_API_KEY, REPORT_TO. Optional: REPORT_FROM, HEALTHCHECK_LISTING_REPORTS_UUID.
on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-listing-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      REPORT_FROM: ${{ secrets.REPORT_FROM }}
      HEALTHCHECK_UUID: ${{ secrets.HEALTHCHECK_LISTING_REPORTS_UUID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Node built-ins only — no npm install. Chrome is preinstalled on ubuntu-latest.
      - name: Build and email the reports
        run: node scripts/send-listing-reports.mjs
