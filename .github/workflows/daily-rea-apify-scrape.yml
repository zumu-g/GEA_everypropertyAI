name: Daily REA scrape (Casey/Cardinia)

# Additional morning feed: scrapes realestate.com.au on-market listings for the
# Casey/Cardinia suburbs via the Apify actor one-api/realestate-com-au-scraper and
# upserts into property_listings (source=rea-apify-one-api). Runs alongside the
# Domain Web Unlocker scrape as a second, independent on-market source.
#
# Schedule: 21:37 UTC daily ≈ 7:37am AEST (Melbourne). Staggered ~14 min after the
# Domain workflow (21:23) so the two heavy ~30-min jobs don't contend on Apify/Bright
# Data simultaneously. The minute is deliberately OFF the top of the hour: GitHub's
# scheduler is best-effort and silently drops/delays runs queued at :00. See
# docs/plans/2026-06-17-001-fix-data-feed-reliability-resequenced-plan.md (U2). Stage 2
# of that plan moves this schedule onto Railway cron; this workflow then keeps only
# workflow_dispatch as a manual break-glass.
#
# Sold is intentionally NOT scraped here: this actor's Sold channel has no sold DATE,
# which property_sales needs for dedup + comp recency. See scripts/ingest-rea-apify.mjs.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APIFY_API_TOKEN, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   HEALTHCHECK_REA_UUID (Healthchecks.io dead-man's-switch check ID; the script no-ops
#     the ping when HEALTHCHECK_UUID is unset, so this is safe to add before it exists.)
# Optional repo variables: REA_RESULT_COUNT (default 10 new / 25 full), REA_PAGES (default 1)
#
# COST (2026-09-19 review): the actor bills per result and has no memory of what we
# hold, so a daily 25/suburb 'Recommended' sweep re-bought ~760 known listings a day
# (~US$70/mo, ~4% new). Six days a week we now run REA_MODE=new (Newest sort +
# newListingOnly, 10/suburb) Tue–Fri Melbourne; the Sunday-UTC run (Monday 7:37am
# Melbourne) is a REA_MODE=full 25/suburb sweep for removals, price changes and the
# weekend's new listings. No weekend runs.

on:
  schedule:
    - cron: '37 21 * * 1-4' # Tue–Fri Melbourne (UTC is a day behind): new listings only
    - cron: '37 21 * * 0'   # Mon Melbourne: full 25/suburb sweep, catches the weekend
  workflow_dispatch:      # manual "Run workflow" from the Actions tab
    inputs:
      mode:
        description: "new (cheap, newest+newListingOnly) or full (25/suburb sweep)"
        default: new
        type: choice
        options: [new, full]

concurrency:
  group: daily-rea-apify-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    name: scrape (on-market)
    timeout-minutes: 45
    env:
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REA_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '37 21 * * 0' && 'full' || 'new') }}
      REA_RESULT_COUNT: ${{ vars.REA_RESULT_COUNT || '' }}
      REA_PAGES: ${{ vars.REA_PAGES || '1' }}
      # Healthchecks.io dead-man's-switch; the script no-ops the ping if this is empty.
      HEALTHCHECK_UUID: ${{ secrets.HEALTHCHECK_REA_UUID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # The runner uses only Node built-ins (fetch/fs/url/path) — no npm install needed.
      - name: Scrape REA on-market
        run: node scripts/ingest-rea-apify.mjs on-market
