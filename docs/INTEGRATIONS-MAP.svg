<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a73e8"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d93025"/>
    </marker>
    <style>
      .name { font-size: 15px; font-weight: 700; fill: #202124; }
      .key  { font-size: 11.5px; font-weight: 600; fill: #5f6368; font-family: ui-monospace, Menlo, monospace; }
      .ep   { font-size: 11.5px; fill: #1a73e8; font-family: ui-monospace, Menlo, monospace; }
      .data { font-size: 11.5px; fill: #3c4043; }
      .lbl  { font-size: 11px; font-weight: 700; }
      .title{ font-size: 20px; font-weight: 800; fill: #fff; }
      .sub  { font-size: 11px; fill: #e8eaed; font-family: ui-monospace, Menlo, monospace; }
      .tool { font-size: 11px; fill: #202124; font-family: ui-monospace, Menlo, monospace; }
      .h    { font-size: 13px; font-weight: 800; fill: #202124; }
    </style>
  </defs>

  <rect width="1320" height="880" fill="#f8f9fa"/>
  <text x="40" y="40" font-size="24" font-weight="800" fill="#202124">everypropertyAI — API / CLI integration map</text>
  <text x="40" y="64" font-size="13" fill="#5f6368">Who connects, how, and what data they receive · all auth via per-consumer <tspan font-family="ui-monospace, Menlo, monospace">epai_…</tspan> keys in <tspan font-family="ui-monospace, Menlo, monospace">EVERYPROPERTY_API_KEYS</tspan></text>

  <!-- Legend -->
  <rect x="980" y="26" width="18" height="12" rx="2" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="1004" y="36" class="lbl" fill="#1a73e8">CLI / MCP (via services/everypropertyai)</text>
  <rect x="980" y="46" width="18" height="12" rx="2" fill="#fce8e6" stroke="#d93025"/>
  <text x="1004" y="56" class="lbl" fill="#d93025">Direct HTTP API</text>

  <!-- ===== CENTER: API ===== -->
  <rect x="500" y="330" width="320" height="230" rx="14" fill="#1f2a44" stroke="#0f1626" stroke-width="2"/>
  <text x="660" y="372" text-anchor="middle" class="title">🏠 everypropertyAI API</text>
  <text x="660" y="392" text-anchor="middle" class="sub">geaeverypropertyai-production.up.railway.app</text>
  <rect x="520" y="410" width="280" height="62" rx="8" fill="#324a7d"/>
  <text x="660" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">services/everypropertyai — MCP server + CLI</text>
  <text x="660" y="448" text-anchor="middle" class="sub">8 tools: search · fetch_property · comps · sold ·</text>
  <text x="660" y="462" text-anchor="middle" class="sub">enrich · street · generate_cma_pack · proposal</text>
  <rect x="520" y="482" width="280" height="58" rx="8" fill="#3f5694"/>
  <text x="660" y="502" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">HTTP routes /api/*</text>
  <text x="660" y="520" text-anchor="middle" class="sub">property · sold-sales · comparable-sales ·</text>
  <text x="660" y="533" text-anchor="middle" class="sub">vendor-report · agents/listings · enrich · search</text>

  <!-- ===== LEFT: CLI/MCP consumers ===== -->
  <!-- GEA_ST_CMA -->
  <g>
    <rect x="40" y="100" width="370" height="120" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="58" y="126" class="name">📊 GEA_ST_CMA</text>
    <text x="300" y="126" class="key">epai_cma_</text>
    <text x="58" y="148" class="ep">POST /property · /comparable-sales · /sold-sales · /enrich</text>
    <text x="58" y="172" class="data">Subject + confidence, price est (low/mid/high),</text>
    <text x="58" y="188" class="data">ranked comparables, suburb sold feed, market stats</text>
    <text x="58" y="210" class="key" fill="#1a73e8">CLI: cma · property · comps · sold · search</text>
  </g>
  <!-- GEA_ST_Proposals -->
  <g>
    <rect x="40" y="240" width="370" height="120" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="58" y="266" class="name">📄 GEA_ST_Proposals</text>
    <text x="270" y="266" class="key" fill="#b06000">epai_ (generic ⚠)</text>
    <text x="58" y="288" class="ep">GET /proposal · /search</text>
    <text x="58" y="312" class="data">Presentation-ready: beds/baths/car/land, price est,</text>
    <text x="58" y="328" class="data">agency + agent, up to 6 hero photos, description, confidence</text>
    <text x="58" y="350" class="key" fill="#1a73e8">CLI: proposal · search</text>
  </g>
  <!-- GEA_CRM -->
  <g>
    <rect x="40" y="380" width="370" height="120" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="58" y="406" class="name">🗂️ GEA_CRM</text>
    <text x="300" y="406" class="key">epai_crm_</text>
    <text x="58" y="428" class="ep">POST /property · GET /address-suggest</text>
    <text x="58" y="452" class="data">Full merged profile (~20 fields) with per-field</text>
    <text x="58" y="468" class="data">confidences + overall → confidence-gated writes</text>
    <text x="58" y="490" class="key" fill="#1a73e8">CLI: property · search</text>
  </g>
  <!-- MAP_findAI — MERGED into GEA_CRM (2026-06-16) -->
  <g opacity="0.85">
    <rect x="60" y="520" width="350" height="120" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="78" y="546" class="name" fill="#5f6368">🎯 Market appraisal / nurture</text>
    <text x="78" y="566" class="key" fill="#1a73e8">↳ merged into GEA_CRM (2026-06-16)</text>
    <text x="78" y="588" class="ep" fill="#80868b">sold --suburb · comps --suburb · street · search</text>
    <text x="78" y="610" class="data" fill="#5f6368">Suburb sold feed, ranked comps, street-level listed data —</text>
    <text x="78" y="626" class="data" fill="#5f6368">now served by GEA_CRM's epai_crm_ key (was MAP_findAI).</text>
  </g>

  <!-- ===== RIGHT: Direct HTTP consumers ===== -->
  <!-- recruitAI -->
  <g>
    <rect x="910" y="180" width="370" height="120" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
    <text x="928" y="206" class="name">🧑‍💼 GEA_HR_recruitAI</text>
    <text x="1150" y="206" class="key" fill="#b06000">epai_ (shared ⚠)</text>
    <text x="928" y="228" class="ep">GET /agents/listings?name=…</text>
    <text x="928" y="252" class="data">An agent's 20 most recent listings + sales</text>
    <text x="928" y="268" class="data">(address, suburb, status, price, date, url, image)</text>
    <text x="928" y="290" class="key" fill="#d93025">Direct HTTP · Bearer epai_</text>
  </g>
  <!-- Vendor report -->
  <g>
    <rect x="910" y="440" width="370" height="120" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
    <text x="928" y="466" class="name">📈 WeeklyCampaignVendor</text>
    <text x="1185" y="466" class="key">epai_wcv_</text>
    <text x="928" y="488" class="ep">GET /vendor-report?lat=&amp;lng=&amp;radius=</text>
    <text x="928" y="512" class="data">3 closest solds + 3 newest listings within radius</text>
    <text x="928" y="528" class="data">(default 500m, max 2km), each with distanceMetres</text>
    <text x="928" y="550" class="key" fill="#d93025">Direct HTTP (or CLI)</text>
  </g>

  <!-- ===== ARROWS ===== -->
  <!-- left consumers -> API MCP box (enters left edge ~x500) -->
  <path d="M410,160 C460,200 470,400 500,430" fill="none" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M410,300 C455,340 465,420 500,438" fill="none" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M410,440 C455,440 465,442 500,446" fill="none" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M410,580 C455,540 465,470 500,454" fill="none" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="455" y="372" class="lbl" fill="#1a73e8" text-anchor="middle">CLI/MCP</text>

  <!-- right consumers -> API HTTP box (enters right edge ~x820) -->
  <path d="M910,240 C865,300 850,460 820,500" fill="none" stroke="#d93025" stroke-width="2" marker-end="url(#arrRed)"/>
  <path d="M910,500 C870,500 855,505 820,512" fill="none" stroke="#d93025" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="868" y="430" class="lbl" fill="#d93025" text-anchor="middle">HTTP</text>

  <!-- footer note -->
  <text x="40" y="700" class="h">Connection types</text>
  <text x="40" y="722" class="data">🔵 3 consumers go through the <tspan font-family="ui-monospace, Menlo, monospace">services/everypropertyai</tspan> MCP server + CLI (each command composes multiple HTTP calls).</text>
  <text x="40" y="740" class="data">🔴 2 consumers call a single <tspan font-family="ui-monospace, Menlo, monospace">/api/*</tspan> route directly with a <tspan font-family="ui-monospace, Menlo, monospace">Bearer epai_…</tspan> token. · ⊘ MAP_findAI merged into GEA_CRM (2026-06-16).</text>
  <text x="40" y="766" class="h">⚠ Key hygiene</text>
  <text x="40" y="788" class="data">GEA_ST_Proposals and GEA_HR_recruitAI share generic <tspan font-family="ui-monospace, Menlo, monospace">epai_</tspan> keys. Dedicated per-consumer keys enable independent rotation/revocation.</text>
  <text x="40" y="858" font-size="11" fill="#9aa0a6">Source: src/middleware.ts · src/app/api/*/route.ts · services/everypropertyai/*_INTEGRATION_PROMPT.md · INTEGRATIONS.md</text>
</svg>
